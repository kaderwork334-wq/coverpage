  <!-- PWA Meta Tags -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 25px;
        }

        @media (max-width: 980px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 6px;
            font-size: 1.55rem;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1e293b;
            font-size: 0.88rem;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14.5px;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #059669;
            color: white;
        }
        .btn-success:hover {
            background: #047857;
        }

        .btn-add {
            background: #0f766e;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
            width: auto;
            margin-top: 6px;
        }

        .btn-remove {
            background: #dc2626;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .member-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .members-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-top: 6px;
        }

        .preview-container {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            overflow: auto;
        }

        #coverPage {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 22mm 18mm;
            box-shadow: 0 6px 25px rgba(0,0,0,0.18);
            position: relative;
            font-family: 'Times New Roman', Times, serif;
            border: 7px solid #0f172a;
            box-sizing: border-box;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 14px;
        }

        .logo-img {
            width: 120px;
            height: 100px;
            margin-bottom: 6px;
            object-fit: contain;
        }

        .uni-name {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 0.5px;
        }

        .uni-tagline {
            font-size: 11.5px;
            color: #475569;
            font-style: italic;
            margin-top: 2px;
        }

        .assignment-banner {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 11px;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 16px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .course-code {
            text-align: center;
            font-size: 15.5px;
            margin-bottom: 22px;
            font-weight: 600;
        }

        .info-box {
            border: 2px solid #1e40af;
            border-radius: 11px;
            padding: 15px 18px;
            margin-bottom: 18px;
            background: #f8fafc;
        }

        .info-box h3 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 7px;
        }

        .info-row {
            margin-bottom: 7px;
            font-size: 14px;
            line-height: 1.45;
        }

        .info-label {
            font-weight: 600;
            color: #1e293b;
            display: inline-block;
            min-width: 115px;
        }

        .members-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
            font-size: 13.5px;
        }

        .members-table th {
            background: #e2e8f0;
            padding: 7px 8px;
            text-align: left;
            font-weight: 600;
        }

        .members-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .date-banner {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 28px;
            border-radius: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #2563eb;
            font-weight: 600;
        }

        .note {
            margin-top: 12px;
            font-size: 12.5px;
            color: #64748b;
            text-align: center;
        }

        /* IUB specific color override */
        .iub-theme .assignment-banner,
        .iub-theme .date-banner {
            background: #0d4f4f;
        }
        .iub-theme .info-box {
            border-color: #0d7377;
        }
        .iub-theme .uni-name {
            color: #0d4f4f;
        }
        .iub-theme .logo-img {
            width: 180px;
            height: 180px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form -->
        <div class="card">
            <h1>Cover Page Generator</h1>
            <p class="subtitle">NSU & IUB • Single / Group Support</p>

            <form id="coverForm">
                <div class="form-group">
                    <label>University</label>
                    <select id="university" onchange="updatePreview()">
                        <option value="nsu">North South University (NSU)</option>
                        <option value="iub">Independent University, Bangladesh (IUB)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Assignment Type</label>
                    <select id="assignType" onchange="toggleMembers()">
                        <option value="single">Single Person</option>
                        <option value="group">Group (Multiple Members)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cover Title (e.g. Assignment, Lab Report, Project,)</label>
                    <input type="text" id="titleLabel" placeholder="e.g. ASSIGNMENT">
                </div>

                <div class="form-group">
                    <label>Number / Title</label>
                    <input type="text" id="assignmentNo" placeholder="e.g. 01">
                </div>

                <div class="form-group">
                    <label>Course Code</label>
                    <input type="text" id="courseCode" placeholder="e.g. CSE173">
                </div>

                <!-- Single Student -->
                <div id="singleSection">
                    <div class="row">
                        <div class="form-group">
                            <label>Student Name</label>
                            <input type="text" id="studentName" placeholder="Full Name">
                        </div>
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" id="studentId" placeholder="e.g. 223XXXXXX">
                        </div>
                    </div>
                </div>

                <!-- Group Members -->
                <div id="groupSection" style="display:none;">
                    <label>Group Members</label>
                    <div class="members-box" id="membersContainer">
                        <!-- Dynamic members will be added here -->
                    </div>
                    <button type="button" class="btn btn-add" onclick="addMember()">+ Add Member</button>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Section</label>
                        <input type="text" id="section" placeholder="e.g. 01">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="department" placeholder="e.g. Computer Science and Engineering">
                    </div>
                </div>

                <div class="form-group">
                    <label>Faculty Name</label>
                    <input type="text" id="facultyName" placeholder="e.g. Dr. Saiful Islam">
                </div>

                <div class="form-group" id="facultyInitialGroup">
                    <label>Faculty Initial / Short Code</label>
                    <input type="text" id="facultyInitial" placeholder="e.g. SIF">
                </div>

                <div class="form-group">
                    <label>Submitted On (Date)</label>
                    <input type="text" id="submitDate" placeholder="e.g. 13th March 2025">
                </div>

                <button type="button" class="btn btn-primary" onclick="updatePreview()">Update Preview</button>
                <button type="button" class="btn btn-success" onclick="downloadPDF()">Download PDF</button>
                
                <div class="loading" id="loading">Generating PDF... Please wait</div>
            </form>

            <p class="note">
               
            </p>
        </div>

        <!-- Preview -->
        <div class="card">
            <h1 style="font-size: 1.3rem; margin-bottom: 12px;">Live Preview</h1>
            <div class="preview-container">
                <div id="coverPage"></div>
            </div>
        </div>
    </div>

        let memberCount = 0;

        function toggleMembers() {
            const type = document.getElementById('assignType').value;
            document.getElementById('singleSection').style.display = type === 'single' ? 'block' : 'none';
            document.getElementById('groupSection').style.display = type === 'group' ? 'block' : 'none';
            
            if (type === 'group' && memberCount === 0) {
                addMember();
                addMember();
            }
            updatePreview();
        }

        function addMember() {

            div.id = `member-${memberCount}`;
            div.innerHTML = `
                <input type="text" placeholder="Name" class="m-name">
                <input type="text" placeholder="Student ID" class="m-id">
                <button type="button" class="btn-remove" onclick="removeMember(${memberCount})">✕</button>
            `;
            container.appendChild(div);
        }

        function removeMember(id) {
            const el = document.getElementById(`member-${id}`);
            if (el) el.remove();
        }

        function getMembers() {
            const rows = document.querySelectorAll('#membersContainer .member-row');
            const list = [];
            rows.forEach(row => {
                const name = row.querySelector('.m-name').value.trim();
                const id = row.querySelector('.m-id').value.trim();
                if (name || id) list.push({ name: name || '—', id: id || '—' });
            });
            return list;
        }

        function updatePreview() {
            const uni = document.getElementById('university').value;
            const type = document.getElementById('assignType').value;
            const titleLabel = document.getElementById('titleLabel').value || 'ASSIGNMENT';
            const assignmentNo = document.getElementById('assignmentNo').value || '01';
            const courseCode = document.getElementById('courseCode').value || 'CSE173';
            const section = document.getElementById('section').value || '01';
            const department = document.getElementById('department').value || 'Computer Science and Engineering';
            const facultyName = document.getElementById('facultyName').value || 'Faculty Name';
            const facultyInitial = document.getElementById('facultyInitial').value || 'Initial';
            const submitDate = document.getElementById('submitDate').value || 'Date';

            const isIUB = uni === 'iub';
            const logo = isIUB ? iubLogo : nsuLogo;

            document.getElementById('facultyInitialGroup').style.display = isIUB ? 'none' : 'block';
            const uniName = isIUB ? 'INDEPENDENT UNIVERSITY, BANGLADESH' : 'NORTH SOUTH UNIVERSITY';
            const tagline = isIUB ? ' ' : 'Center of Excellence in Higher Education';
            const deptText = isIUB ? department + ', IUB' : department + ', NSU';

            let submittedByHTML = '';

            if (type === 'single') {
                const studentName = document.getElementById('studentName').value || 'Student Name';
                const studentId = document.getElementById('studentId').value || 'Student ID';
                submittedByHTML = `
                    <div class="info-row"><span class="info-label">Student name :</span> ${studentName}</div>
                    <div class="info-row"><span class="info-label">Student ID :</span> ${studentId}</div>
                    <div class="info-row"><span class="info-label">Section :</span> ${section}</div>
                    <div class="info-row"><span class="info-label">Dept. :</span> ${deptText}</div>
                `;
            } else {
                const members = getMembers();
                let tableRows = '';
                members.forEach((m, i) => {
                    tableRows += `<tr><td>${i+1}</td><td>${m.name}</td><td>${m.id}</td></tr>`;
                });
                if (members.length === 0) {
                    tableRows = `<tr><td colspan="3" style="text-align:center;color:#94a3b8;">No members added</td></tr>`;
                }

                submittedByHTML = `
                    <div class="info-row"><span class="info-label">Section :</span> ${section}</div>
                    <div class="info-row"><span class="info-label">Dept. :</span> ${deptText}</div>
                    <table class="members-table">
                        <thead>
                            <tr><th>#</th><th>Name</th><th>Student ID</th></tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                `;
            }

            const submittedByBox = `
                <div class="info-box">
                    <h3>Submitted By</h3>
                    ${submittedByHTML}
                </div>
            `;

            const submittedToBox = `
                <div class="info-box">
                    <h3>Submitted To</h3>
                    <div class="info-row"><span class="info-label">Faculty name :</span> ${facultyName}</div>
                    ${isIUB ? '' : `<div class="info-row"><span class="info-label">Faculty initial :</span> ${facultyInitial}</div>`}
                    <div class="info-row"><span class="info-label">Lecturer :</span> Dept. of ${deptText}</div>
                </div>
            `;

            const html = `
                <div class="logo-section">
                    <img src="${logo}" class="logo-img" alt="Logo">
                    <div class="uni-name">${uniName}</div>
                    <div class="uni-tagline">${tagline}</div>
                </div>

                <div class="assignment-banner">${titleLabel.toUpperCase()} – ${assignmentNo}</div>
                <div class="course-code">Course code : ${courseCode}</div>

                ${isIUB ? submittedToBox + submittedByBox : submittedByBox + submittedToBox}

                <div class="date-banner">Submitted on ${submitDate}</div>
            `;

            const cover = document.getElementById('coverPage');
            cover.innerHTML = html;
            cover.className = isIUB ? 'iub-theme' : '';
        }

        async function downloadPDF() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            updatePreview();

            const element = document.getElementById('coverPage');

            try {
                const canvas = await html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
                
                const uni = document.getElementById('university').value.toUpperCase();
                const course = document.getElementById('courseCode').value || 'Course';
                const fileName = `${uni}_Cover_${course}.pdf`;
                
                pdf.save(fileName);
            } catch (err) {
                alert('PDF generate করতে সমস্যা হয়েছে। আবার try করুন।');
                console.error(err);
            } finally {
                loading.style.display = 'none';
            }
        }

        // Init
        window.onload = function() {
            const today = new Date();
            const day = today.getDate();
            const suffix = (day % 10 === 1 && day !== 11) ? 'st' :
                           (day % 10 === 2 && day !== 12) ? 'nd' :
                           (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('submitDate').value = `${day}${suffix} ${months[today.getMonth()]} ${today.getFullYear()}`;
            
            updatePreview();
        };
    </script>
</body>
</html>
